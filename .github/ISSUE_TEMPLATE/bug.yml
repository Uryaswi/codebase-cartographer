name: Bug report
description: Something produces wrong output or crashes
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command run
      render: shell
      placeholder: carto hotspots --repo /path/to/repo --top 5
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected (cite the PRD formula/criterion if relevant)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
