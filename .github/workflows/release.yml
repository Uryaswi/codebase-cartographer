name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: ruff check .
      - run: pytest -q
      - name: Check tag matches package version
        run: |
          version=$(python -c "import cartographer; print(cartographer.__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      - run: python -m build
      - name: Create GitHub release with wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
